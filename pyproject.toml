[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "barra2_downloader"
version = "0.0.1"
authors = [
  { name="Brendon Duncan", email="brendon.duncan@uq.edu.au" },
]
description = "A downloader for BARRA2 data"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/bdunc2/barra2_downloader"